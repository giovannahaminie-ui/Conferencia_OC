<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desempenho — Conferência de OC</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/icone_tiete.png">
<style>
  :root{
    --bg:#f1f4f9;--bg-card:#fff;--bg-subtle:#f7f9fc;
    --border:#e3e7ef;--border-strong:#cfd6e3;
    --text:#12172a;--text-dim:#4a5470;--text-faint:#7a85a0;
    --accent-1:#4c8dae;--accent-2:#7c6fcf;--accent-solid:#4c8dae;
    --accent-grad:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    --gold:#f59e0b;--silver:#94a3b8;--bronze:#c2773a;
    --ok:#16a34a;--warn:#d97706;--info:#0891b2;--bad:#dc2626;
    --radius:18px;--radius-sm:12px;
    --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.22,1.2,.36,1);
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px -10px rgba(15,23,42,.14);
    --shadow-hover:0 18px 36px -16px rgba(15,23,42,.28),0 2px 8px rgba(15,23,42,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0f1420;--bg-card:#1a2333;--bg-subtle:#212d42;
    --border:#2c3a52;--border-strong:#3c4d6b;
    --text:#e7ecf6;--text-dim:#b4bfd4;--text-faint:#8693b0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -12px rgba(0,0,0,.6);
    --shadow-hover:0 18px 36px -16px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 460px at 92% -8%,color-mix(in srgb,var(--accent-1) 13%,transparent),transparent 62%),
      radial-gradient(900px 420px at -6% 0%,color-mix(in srgb,var(--accent-2) 11%,transparent),transparent 58%),
      var(--bg);
    background-attachment:fixed;
  }
  svg{display:block}
  .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* ── Cabeçalho ───────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 26px;
    background:color-mix(in srgb,var(--bg-card) 82%,transparent);backdrop-filter:blur(14px) saturate(1.5);
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:.78rem;font-weight:650;
    color:var(--text-dim);padding:8px 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-card);
    transition:all .18s var(--ease)}
  .back .ic{width:15px;height:15px;transition:transform .18s var(--ease)}
  .back:hover{border-color:var(--accent-1);color:var(--accent-solid);transform:translateX(-2px)}
  .back:hover .ic{transform:translateX(-2px)}
  .ttl{display:flex;align-items:center;gap:12px;min-width:0}
  .ttl-ico{width:38px;height:38px;border-radius:12px;background:var(--accent-grad);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent-1) 80%,transparent)}
  h1{font-size:1.02rem;font-weight:800;letter-spacing:-.015em}
  .ttl p{font-size:.7rem;color:var(--text-faint);margin-top:1px}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .seg{position:relative;display:inline-flex;padding:4px;border-radius:14px;background:var(--bg-subtle);border:1px solid var(--border)}
  .seg button{position:relative;z-index:1;border:none;background:transparent;font:inherit;font-size:.74rem;font-weight:650;
    padding:7px 14px;border-radius:10px;color:var(--text-dim);cursor:pointer;transition:color .2s var(--ease)}
  .seg button.on{color:#fff}
  .seg-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:10px;background:var(--accent-grad);
    box-shadow:0 6px 14px -6px color-mix(in srgb,var(--accent-1) 80%,transparent);transition:transform .35s var(--spring),width .35s var(--spring)}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .18s var(--ease)}
  .icon-btn:hover{color:var(--accent-solid);border-color:var(--accent-1)}
  .icon-btn.spin .ic{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .wrap{max-width:1180px;margin:0 auto;padding:24px 26px 70px;display:flex;flex-direction:column;gap:20px}

  /* ── Entrada escalonada ──────────────────────────────────── */
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .rise{animation:rise .6s var(--spring) both}
  .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}

  /* ── Insights (mensagens) ────────────────────────────────── */
  .insights{display:flex;gap:10px;flex-wrap:wrap}
  .insight{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 9px;border-radius:14px;font-size:.78rem;font-weight:550;
    background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--text)}
  .insight b{font-weight:800}
  .insight .chip{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--c);
    background:color-mix(in srgb,var(--c) 14%,var(--bg-card))}
  .insight .chip .ic{width:16px;height:16px}

  /* ── KPIs ────────────────────────────────────────────────── */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.kpis{grid-template-columns:1fr}}
  .kpi{position:relative;overflow:hidden;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;
    box-shadow:var(--shadow);transition:transform .3s var(--spring),box-shadow .3s var(--ease),border-color .3s var(--ease)}
  .kpi::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--k) 18%,transparent),transparent)}
  .kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--k) 40%,var(--border))}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .kpi-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--k);
    background:color-mix(in srgb,var(--k) 14%,var(--bg-card));border:1px solid color-mix(in srgb,var(--k) 26%,transparent)}
  .kpi-lbl{font-size:.7rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
  .kpi-num{font-size:2.2rem;font-weight:850;letter-spacing:-.035em;line-height:1;margin-top:16px;font-variant-numeric:tabular-nums}
  .kpi-num small{font-size:1.1rem;font-weight:700;color:var(--text-faint);margin-left:2px}
  .kpi-foot{font-size:.72rem;color:var(--text-faint);margin-top:8px;position:relative;z-index:1}
  .ring{width:52px;height:52px}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ring .bg{stroke:color-mix(in srgb,var(--k) 16%,var(--bg-subtle))}
  .ring .fg{stroke:var(--k);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.1s var(--ease) .2s}

  /* ── Cartões de seção ────────────────────────────────────── */
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;min-width:0}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .card-h h2{font-size:.9rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .card-h h2 .ic{color:var(--accent-solid)}
  .card-h .sub{font-size:.7rem;color:var(--text-faint)}
  .legend{display:flex;gap:14px;font-size:.7rem;font-weight:600;color:var(--text-dim)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  /* ── Pódio ───────────────────────────────────────────────── */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:6px 0 0;min-height:250px}
  .pd{display:flex;flex-direction:column;align-items:center;width:min(170px,30%);min-width:0}
  .pd-av{position:relative;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
    font-weight:800;font-size:1.25rem;background:var(--uc);margin-bottom:10px;
    box-shadow:0 0 0 3px var(--bg-card),0 0 0 5px var(--m),0 12px 22px -8px var(--uc)}
  .pd.p1 .pd-av{width:70px;height:70px;font-size:1.5rem}
  .pd-crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:var(--gold);width:26px;height:26px;fill:var(--gold);stroke:#b45309;stroke-width:1.2;
    animation:floatY 3s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(245,158,11,.5))}
  @keyframes floatY{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
  .pd-name{font-size:.8rem;font-weight:750;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pd-sub{font-size:.68rem;color:var(--text-faint);margin:2px 0 10px;text-align:center}
  .pd-bar{position:relative;width:100%;border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;align-items:center;padding-top:12px;color:#fff;
    background:linear-gradient(180deg,var(--m),color-mix(in srgb,var(--m) 62%,#000));
    box-shadow:0 14px 26px -14px var(--m);transform-origin:bottom;animation:grow .9s var(--spring) both;animation-delay:var(--dl)}
  .pd-bar::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%)}
  .pd-rank{font-size:1.9rem;font-weight:900;line-height:1;position:relative;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  .pd-num{font-size:.72rem;font-weight:700;margin-top:6px;position:relative;opacity:.95}
  .p1{--m:var(--gold)}.p2{--m:var(--silver)}.p3{--m:var(--bronze)}
  @keyframes grow{from{transform:scaleY(0);opacity:.4}to{transform:scaleY(1);opacity:1}}

  /* ── Gráficos ────────────────────────────────────────────── */
  .grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .chart-wrap{position:relative}
  .chart{width:100%;height:auto;overflow:visible}
  .chart .grid{stroke:var(--border);stroke-dasharray:3 5}
  .chart .axis{fill:var(--text-faint);font-size:10.5px;font-weight:600}
  .chart .lbl{fill:var(--text-dim);font-size:11px;font-weight:650;text-anchor:middle}
  .chart .val{fill:var(--text);font-size:11px;font-weight:800;text-anchor:middle}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .85s var(--spring) both;animation-delay:var(--dl)}
  .hit{fill:transparent;cursor:pointer}
  .hit:hover{fill:color-mix(in srgb,var(--accent-1) 8%,transparent)}
  .tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg-card);border-radius:12px;padding:10px 13px;font-size:.72rem;line-height:1.55;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;min-width:150px}
  .tip.show{opacity:1;transform:none}
  .tip b{display:block;font-size:.78rem;margin-bottom:3px}
  .tip span{display:flex;justify-content:space-between;gap:14px}
  .donut-box{display:flex;flex-direction:column;align-items:center;gap:16px}
  .donut{position:relative;width:176px;height:176px}
  .donut svg{width:100%;height:100%;transform:rotate(-90deg)}
  .donut circle{fill:none;stroke-width:22}
  .donut .trk{stroke:var(--bg-subtle)}
  .donut .seg-c{transition:stroke-dasharray 1.1s var(--ease),stroke-dashoffset 1.1s var(--ease);stroke-linecap:butt}
  .donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut-mid b{font-size:1.9rem;font-weight:850;letter-spacing:-.03em;line-height:1}
  .donut-mid span{font-size:.68rem;color:var(--text-faint);margin-top:3px;font-weight:600}
  .dl{width:100%;display:flex;flex-direction:column;gap:8px}
  .dl-row{display:flex;align-items:center;gap:9px;font-size:.76rem}
  .dl-row i{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .dl-row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .dl-row .p{font-weight:800;font-variant-numeric:tabular-nums}
  .dl-row .q{color:var(--text-faint);font-size:.68rem;min-width:30px;text-align:right}

  /* ── Classificação ───────────────────────────────────────── */
  .rk{display:flex;flex-direction:column;gap:10px}
  .rk-h,.rk-r{display:grid;grid-template-columns:46px minmax(150px,1.5fr) minmax(130px,1.3fr) 74px 74px 100px 130px;gap:12px;align-items:center;padding:0 14px}
  .rk-h{font-size:.64rem;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint)}
  .rk-h .r,.rk-r .r{text-align:right}
  .rk-r{padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card);font-size:.78rem;
    transition:transform .22s var(--spring),box-shadow .22s var(--ease),border-color .22s var(--ease);animation:rise .55s var(--spring) both;animation-delay:var(--dl)}
  .rk-r:hover{transform:translateX(4px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--uc) 45%,var(--border))}
  .rk-pos{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:850;font-size:.82rem;
    color:var(--text-dim);background:var(--bg-subtle);border:1px solid var(--border)}
  .rk-r.m1 .rk-pos{background:linear-gradient(135deg,#fde68a,var(--gold));color:#7a4a00;border-color:transparent}
  .rk-r.m2 .rk-pos{background:linear-gradient(135deg,#e2e8f0,var(--silver));color:#334155;border-color:transparent}
  .rk-r.m3 .rk-pos{background:linear-gradient(135deg,#f5c9a0,var(--bronze));color:#5a2d0a;border-color:transparent}
  .rk-u{display:flex;align-items:center;gap:10px;min-width:0}
  .rk-av{width:32px;height:32px;border-radius:50%;background:var(--uc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0;
    box-shadow:0 6px 12px -5px var(--uc)}
  .rk-nm{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:.6rem;font-weight:750;padding:1px 7px 1px 5px;border-radius:20px;color:var(--c);
    background:color-mix(in srgb,var(--c) 13%,var(--bg-card));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
  .tag .ic{width:10px;height:10px;stroke-width:2.2}
  .pg{display:flex;align-items:center;gap:10px}
  .pg-t{flex:1;height:8px;border-radius:8px;background:var(--bg-subtle);overflow:hidden;border:1px solid var(--border)}
  .pg-f{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--uc),color-mix(in srgb,var(--uc) 55%,#fff));transform-origin:left;animation:growx 1s var(--ease) both;animation-delay:var(--dl)}
  @keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .pg-p{font-weight:800;font-size:.74rem;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .rk-r .num{text-align:right;font-variant-numeric:tabular-nums}
  .rk-r .num strong{font-size:.95rem}
  .muted{color:var(--text-faint)}
  @media(max-width:1000px){
    .rk-h{display:none}
    .rk-r{grid-template-columns:40px 1fr 1fr;row-gap:10px}
    .rk-r .hide-s{display:none}
  }

  /* ── Estados ─────────────────────────────────────────────── */
  .sk{border-radius:var(--radius);border:1px solid var(--border);
    background:linear-gradient(100deg,var(--bg-card) 30%,var(--bg-subtle) 50%,var(--bg-card) 70%);background-size:220% 100%;animation:shim 1.5s linear infinite}
  @keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}
  .state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:54px 20px;color:var(--text-dim)}
  .state svg{width:84px;height:84px;color:var(--accent-1);opacity:.85}
  .state h3{font-size:1rem;font-weight:800;color:var(--text)}
  .state p{font-size:.8rem;max-width:380px;line-height:1.55}
  .state button{margin-top:6px;border:none;border-radius:12px;padding:10px 18px;font:inherit;font-size:.78rem;font-weight:700;color:#fff;background:var(--accent-grad);cursor:pointer;
    box-shadow:0 10px 20px -10px color-mix(in srgb,var(--accent-1) 80%,transparent)}
  .foot{text-align:center;font-size:.7rem;color:var(--text-faint)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="/"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Board</a>
  <div class="ttl">
    <span class="ttl-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>
    <div><h1>Desempenho da equipe</h1><p>Ranking de conferências e tempo de resposta por usuário</p></div>
  </div>
  <div class="hdr-right">
    <div class="seg" id="filtros">
      <span class="seg-ind" id="segInd"></span>
      <button data-p="dia">Hoje</button>
      <button data-p="semana">7 dias</button>
      <button data-p="mes">30 dias</button>
      <button data-p="total" class="on">Total</button>
    </div>
    <button class="icon-btn" id="btnRefresh" title="Atualizar" aria-label="Atualizar"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
  </div>
</header>

<main class="wrap">
  <section class="insights" id="insights"></section>
  <section class="kpis" id="kpis"></section>
  <section id="painel"></section>
  <div class="foot" id="foot"></div>
</main>
<div class="tip" id="tip"></div>

<script>
  // Herda tema + cor de destaque do board (mesmas chaves de localStorage).
  try{
    const a=JSON.parse(localStorage.getItem("conf_oc_accent")||"null");
    if(a&&a.c1){const r=document.documentElement.style;
      r.setProperty("--accent-1",a.c1);r.setProperty("--accent-2",a.c2);
      r.setProperty("--accent-solid",a.c1);
      r.setProperty("--accent-grad",`linear-gradient(135deg,${a.c1},${a.c2})`);}
  }catch{}
  document.documentElement.setAttribute("data-theme",
    localStorage.getItem("conf_oc_tema")==="escuro"?"dark":"light");

  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const ico=(d,cls="")=>`<svg class="ic ${cls}" viewBox="0 0 24 24">${d}</svg>`;
  const IC={
    trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
    inbox:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    gauge:'<path d="M5 19 19 5"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/>',
    bolt:'<path d="M13 3 5 13h6l-1 8 8-10h-6l1-8Z"/>',
    flame:'<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9Z"/>',
    pin:'<path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10Z"/><circle cx="12" cy="11" r="2"/>',
    trend:'<path d="m4 16 5-5 4 4 7-8M15 7h5v5"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5M16 5.5a3 3 0 0 1 0 5.5M18 15.2c1.8.6 2.8 2.2 3 4.8"/>',
    list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
    pie:'<path d="M12 3a9 9 0 1 0 9 9h-9V3Z"/><path d="M15 3.6A9 9 0 0 1 20.4 9H15V3.6Z"/>'
  };
  function fmtDur(seg){
    if(seg==null) return "—";
    const h=seg/3600;
    if(h<1) return Math.max(1,Math.round(seg/60))+" min";
    if(h<48) return (h.toFixed(1).replace(".0",""))+" h";
    return Math.floor(h/24)+"d "+Math.round(h%24)+"h";
  }
  function fmtData(s){ if(!s) return "—"; const d=new Date(s);
    return isNaN(d)?s:d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;
  const inicial=n=>String(n||"?").trim().charAt(0).toUpperCase()||"?";
  const primeiro=n=>String(n||"").trim().split(/\s+/)[0]||"—";
  const plural=(n,s,p)=>n===1?s:p;
  const PERIODO_TXT={dia:"hoje",semana:"nos últimos 7 dias",mes:"nos últimos 30 dias",total:"no total"};

  /* ── Filtro (indicador deslizante) ─────────────────────── */
  function moveInd(){
    const on=document.querySelector("#filtros button.on"), ind=$("segInd");
    if(!on) return;
    ind.style.width=on.offsetWidth+"px";
    ind.style.transform=`translateX(${on.offsetLeft-4}px)`;
  }
  window.addEventListener("resize",moveInd);

  /* ── Contagem animada ──────────────────────────────────── */
  function countUp(el){
    const to=parseFloat(el.dataset.count)||0, dur=1000, t0=performance.now();
    if(matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent=to; return; }
    (function f(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=Math.round(to*e);
      if(k<1) requestAnimationFrame(f);
    })(t0);
  }

  let periodo="total";
  function loading(){
    $("insights").innerHTML="";
    $("kpis").innerHTML=[0,1,2,3].map(()=>'<div class="sk" style="height:148px"></div>').join("");
    $("painel").innerHTML='<div class="sk" style="height:320px"></div>';
    $("foot").textContent="";
  }
  function estado(titulo,texto,botao){
    $("painel").innerHTML=`<div class="card"><div class="state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></svg>
      <h3>${esc(titulo)}</h3><p>${esc(texto)}</p>${botao?'<button id="btnRetry">Tentar novamente</button>':""}</div></div>`;
    if(botao) $("btnRetry").addEventListener("click",carregar);
  }

  async function carregar(){
    loading();
    $("btnRefresh").classList.add("spin");
    let r;
    try{ r=await fetch("/api/crm/desempenho?periodo="+periodo); }
    catch{ $("kpis").innerHTML=""; estado("Sem conexão com o servidor","Não foi possível carregar os dados agora. Verifique a rede e tente novamente.",true); $("btnRefresh").classList.remove("spin"); return; }
    $("btnRefresh").classList.remove("spin");
    if(r.status===401||r.status===403){ location.href="/"; return; }
    const txt=await r.text(); let d;
    try{ d=JSON.parse(txt); }
    catch{ $("kpis").innerHTML=""; estado("Erro ao carregar os dados","O servidor respondeu algo inesperado. Reinicie o servidor e tente novamente.",true); return; }
    render(d);
  }

  /* ── Render principal ──────────────────────────────────── */
  function render(d){
    const g=d.geral||{}, us=(d.usuarios||[]).slice();
    const atrib=g.atribuidas_total||0, fin=g.finalizadas_total||0;
    const taxa=pct(fin,atrib), pend=Math.max(0,atrib-fin);
    const total=periodo==="total";

    // KPIs
    const C=2*Math.PI*21;
    $("kpis").innerHTML=`
      <div class="kpi rise d1" style="--k:#4c8dae">
        <div class="kpi-top"><span class="kpi-lbl">Notas atribuídas</span><span class="kpi-ico">${ico(IC.inbox)}</span></div>
        <div class="kpi-num" data-count="${atrib}">0</div>
        <div class="kpi-foot">${pend>0&&total?`${pend} ainda ${plural(pend,"pendente","pendentes")}`:"Total já distribuído à equipe"}</div>
      </div>
      <div class="kpi rise d2" style="--k:#16a34a">
        <div class="kpi-top"><span class="kpi-lbl">Finalizadas</span><span class="kpi-ico">${ico(IC.check)}</span></div>
        <div class="kpi-num" data-count="${fin}">0</div>
        <div class="kpi-foot">Notas integradas ${PERIODO_TXT[periodo]||""}</div>
      </div>
      <div class="kpi rise d3" style="--k:#7c6fcf">
        <div class="kpi-top"><span class="kpi-lbl">Taxa de conclusão</span>
          <svg class="ring" viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="21"/><circle class="fg" id="ringFg" cx="26" cy="26" r="21" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        </div>
        <div class="kpi-num"><span data-count="${taxa}">0</span><small>%</small></div>
        <div class="kpi-foot">${fin} de ${atrib} ${plural(atrib,"nota","notas")} concluídas</div>
      </div>
      <div class="kpi rise d4" style="--k:#d97706">
        <div class="kpi-top"><span class="kpi-lbl">Tempo médio</span><span class="kpi-ico">${ico(IC.clock)}</span></div>
        <div class="kpi-num" style="font-size:1.9rem">${esc(fmtDur(g.tempo_medio_seg))}</div>
        <div class="kpi-foot">Da atribuição até finalizada</div>
      </div>`;
    document.querySelectorAll("[data-count]").forEach(countUp);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ const f=$("ringFg"); if(f) f.style.strokeDashoffset=C*(1-Math.min(1,taxa/100)); }));

    if(!us.length){
      $("insights").innerHTML="";
      $("painel").innerHTML=`<div class="card rise d5"><div class="state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18" opacity=".5"/></svg>
        <h3>Nenhuma atribuição registrada ainda</h3>
        <p>Assim que as notas forem atribuídas e finalizadas pela equipe, o ranking e os gráficos aparecem aqui.</p></div></div>`;
      $("foot").textContent="";
      return;
    }

    // Destaques
    const comFin=us.filter(u=>u.finalizadas>0);
    const lider=comFin[0];
    const rapido=us.filter(u=>u.tempo_medio_seg!=null).sort((a,b)=>a.tempo_medio_seg-b.tempo_medio_seg)[0];
    const msgs=[];
    if(lider) msgs.push({c:"#f59e0b",i:IC.trophy,t:`<b>${esc(primeiro(lider.nomusu))}</b> lidera com <b>${lider.finalizadas}</b> ${plural(lider.finalizadas,"nota finalizada","notas finalizadas")}`});
    else msgs.push({c:"#7a85a0",i:IC.clock,t:`Nenhuma nota finalizada ${PERIODO_TXT[periodo]||""} ainda`});
    if(rapido && us.filter(u=>u.tempo_medio_seg!=null).length>1) msgs.push({c:"#0891b2",i:IC.bolt,t:`<b>${esc(primeiro(rapido.nomusu))}</b> é o mais rápido: média de <b>${esc(fmtDur(rapido.tempo_medio_seg))}</b>`});
    if(total && pend>0) msgs.push({c:"#d97706",i:IC.pin,t:`<b>${pend}</b> ${plural(pend,"nota atribuída ainda aguarda","notas atribuídas ainda aguardam")} finalização`});
    else if(total && atrib>0 && pend===0) msgs.push({c:"#16a34a",i:IC.check,t:"Tudo em dia: todas as notas atribuídas foram finalizadas"});
    msgs.push({c:"#7c6fcf",i:IC.users,t:`<b>${us.length}</b> ${plural(us.length,"usuário","usuários")} no ranking`});
    $("insights").innerHTML=msgs.map((m,i)=>`<div class="insight rise d${Math.min(i+1,6)}" style="--c:${m.c}"><span class="chip">${ico(m.i)}</span><span>${m.t}</span></div>`).join("");

    $("painel").innerHTML=`
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="card rise d4">
          <div class="card-h"><h2>${ico(IC.trophy)} Pódio</h2><span class="sub">Quem mais finalizou notas ${esc(PERIODO_TXT[periodo]||"")}</span></div>
          ${podio(comFin)}
        </div>
        <div class="grid2">
          <div class="card rise d5">
            <div class="card-h"><h2>${ico(IC.chart)} Atribuídas × Finalizadas</h2>
              <div class="legend"><span><i style="background:color-mix(in srgb,var(--accent-1) 38%,var(--bg-card));border:1px solid var(--accent-1)"></i>Atribuídas</span><span><i style="background:var(--ok)"></i>Finalizadas</span></div></div>
            <div class="chart-wrap" id="chartWrap">${grafico(us)}</div>
          </div>
          <div class="card rise d6">
            <div class="card-h"><h2>${ico(IC.pie)} Participação</h2><span class="sub">% das finalizadas</span></div>
            ${rosca(us,fin)}
          </div>
        </div>
        <div class="card rise d6">
          <div class="card-h"><h2>${ico(IC.list)} Classificação completa</h2><span class="sub">${us.length} ${plural(us.length,"usuário","usuários")}</span></div>
          ${ranking(us,rapido,lider)}
        </div>
      </div>`;
    ligarGrafico(us);
    animarRosca();
    $("foot").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }

  /* ── Pódio ─────────────────────────────────────────────── */
  function podio(lista){
    if(!lista.length) return `<div class="state" style="padding:30px 10px"><p>Ninguém finalizou notas neste período ainda. Assim que houver conclusões, o pódio aparece aqui.</p></div>`;
    const top=lista.slice(0,3);
    const ordem=top.length===3?[1,0,2]:top.length===2?[1,0]:[0];
    const alt=[160,118,90];
    return `<div class="podium">${ordem.map(i=>{
      const u=top[i], p=i+1;
      return `<div class="pd p${p}" style="--uc:${esc(u.cor)}">
        <div class="pd-av">${p===1?`<svg class="pd-crown" viewBox="0 0 24 24"><path d="m3 8 4.5 4.5L12 5l4.5 7.5L21 8l-2 11H5L3 8Z" stroke-linejoin="round"/></svg>`:""}${esc(inicial(u.nomusu))}</div>
        <div class="pd-name" title="${esc(u.nomusu)}">${esc(u.nomusu)}</div>
        <div class="pd-sub">${esc(fmtDur(u.tempo_medio_seg))} de média</div>
        <div class="pd-bar" style="height:${alt[i]}px;--dl:${(3-i)*0.12}s"><span class="pd-rank">${p}º</span><span class="pd-num">${u.finalizadas} ${plural(u.finalizadas,"nota","notas")}</span></div>
      </div>`;}).join("")}</div>`;
  }

  /* ── Gráfico de colunas (SVG) ──────────────────────────── */
  // máximo do eixo = 4 divisões "redondas" (1, 2, 5, 10 × potência de 10), pra os rótulos saírem inteiros
  function niceMax(v){
    const x=Math.max(1,v)/4, p=Math.pow(10,Math.floor(Math.log10(x))), n=x/p;
    const passo=Math.max(1,(n<=1?1:n<=2?2:n<=5?5:10)*p);
    return passo*4;
  }
  function grafico(us){
    const dados=us.slice(0,8);
    const W=640,H=300,L=38,R=10,T=22,B=54, ph=H-T-B, pw=W-L-R;
    const max=niceMax(Math.max(1,...dados.map(u=>Math.max(u.atribuidas,u.finalizadas))));
    const y=v=>T+ph-(v/max)*ph;
    const gw=pw/dados.length, bw=Math.min(28,gw*.3);
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Notas atribuídas e finalizadas por usuário">
      <defs>
        <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient>
        <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent-1)" stop-opacity=".55"/><stop offset="1" stop-color="var(--accent-1)" stop-opacity=".18"/></linearGradient>
      </defs>`;
    for(let k=0;k<=4;k++){
      const v=max/4*k, yy=y(v);
      s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="axis" x="${L-8}" y="${yy+3.5}" text-anchor="end">${Math.round(v)}</text>`;
    }
    dados.forEach((u,i)=>{
      const cx=L+gw*i+gw/2, ha=Math.max(2,ph*u.atribuidas/max), hf=u.finalizadas>0?Math.max(2,ph*u.finalizadas/max):0;
      const dl=(i*0.07)+"s";
      s+=`<rect class="hit" data-i="${i}" x="${L+gw*i}" y="${T-12}" width="${gw}" height="${ph+12+B-14}" rx="10"/>`;
      s+=`<rect class="bar" x="${cx-bw-2}" y="${T+ph-ha}" width="${bw}" height="${ha}" rx="6" fill="url(#gA)" stroke="var(--accent-1)" stroke-opacity=".5" style="--dl:${dl}"/>`;
      if(hf) s+=`<rect class="bar" x="${cx+2}" y="${T+ph-hf}" width="${bw}" height="${hf}" rx="6" fill="url(#gF)" style="--dl:${dl}"/>`;
      if(u.finalizadas>0) s+=`<text class="val" x="${cx+2+bw/2}" y="${T+ph-hf-6}">${u.finalizadas}</text>`;
      const nome=primeiro(u.nomusu); s+=`<text class="lbl" x="${cx}" y="${H-B+20}">${esc(nome.length>11?nome.slice(0,10)+"…":nome)}</text>`;
      s+=`<circle cx="${cx}" cy="${H-B+34}" r="4" fill="${esc(u.cor)}"/>`;
    });
    return s+"</svg>"+(us.length>8?`<div class="sub" style="text-align:center;margin-top:6px;font-size:.7rem;color:var(--text-faint)">Mostrando os 8 primeiros de ${us.length} usuários</div>`:"");
  }
  function ligarGrafico(us){
    const w=$("chartWrap"), tip=$("tip"); if(!w) return;
    w.addEventListener("mousemove",e=>{
      const h=e.target.closest(".hit"); if(!h){ tip.classList.remove("show"); return; }
      const u=us[+h.dataset.i]; if(!u) return;
      tip.innerHTML=`<b>${esc(u.nomusu)}</b><span><em style="font-style:normal;opacity:.7">Atribuídas</em><strong>${u.atribuidas}</strong></span><span><em style="font-style:normal;opacity:.7">Finalizadas</em><strong>${u.finalizadas}</strong></span><span><em style="font-style:normal;opacity:.7">Conclusão</em><strong>${pct(u.finalizadas,u.atribuidas)}%</strong></span><span><em style="font-style:normal;opacity:.7">Tempo médio</em><strong>${esc(fmtDur(u.tempo_medio_seg))}</strong></span>`;
      tip.style.left=Math.min(innerWidth-190,e.clientX+16)+"px"; tip.style.top=(e.clientY+16)+"px"; tip.classList.add("show");
    });
    w.addEventListener("mouseleave",()=>tip.classList.remove("show"));
  }

  /* ── Rosca (participação) ──────────────────────────────── */
  const PALETA=["#4c8dae","#7c6fcf","#16a34a","#d97706","#be185d","#0891b2","#94a3b8"];
  let _roscaSegs=[];
  function rosca(us,fin){
    const R=70, C=2*Math.PI*R;
    const com=us.filter(u=>u.finalizadas>0);
    const top=com.slice(0,5), resto=com.slice(5).reduce((a,u)=>a+u.finalizadas,0);
    const itens=top.map((u,i)=>({n:u.nomusu,v:u.finalizadas,c:u.cor||PALETA[i]})).concat(resto?[{n:"Outros",v:resto,c:"#94a3b8"}]:[]);
    const tot=itens.reduce((a,i)=>a+i.v,0)||1;
    let acc=0; _roscaSegs=[];
    const segs=itens.map(it=>{ const len=C*it.v/tot, off=-acc; acc+=len; _roscaSegs.push({len,C}); return `<circle class="seg-c" cx="88" cy="88" r="${R}" stroke="${esc(it.c)}" stroke-dasharray="0 ${C}" stroke-dashoffset="${off}"/>`; }).join("");
    return `<div class="donut-box">
      <div class="donut"><svg viewBox="0 0 176 176"><circle class="trk" cx="88" cy="88" r="${R}"/>${segs}</svg>
        <div class="donut-mid"><b>${fin}</b><span>${plural(fin,"finalizada","finalizadas")}</span></div></div>
      <div class="dl">${itens.length?itens.map(it=>`<div class="dl-row"><i style="background:${esc(it.c)}"></i><span class="n">${esc(it.n)}</span><span class="q">${it.v}</span><span class="p">${pct(it.v,tot)}%</span></div>`).join(""):'<div class="muted" style="text-align:center;font-size:.76rem">Sem finalizações no período.</div>'}</div>
    </div>`;
  }
  function animarRosca(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      document.querySelectorAll(".donut .seg-c").forEach((c,i)=>{ const s=_roscaSegs[i]; if(s) c.setAttribute("stroke-dasharray",`${Math.max(0,s.len-1.5)} ${s.C}`); });
    }));
  }

  /* ── Classificação ─────────────────────────────────────── */
  function ranking(us,rapido,lider){
    return `<div class="rk">
      <div class="rk-h"><span>#</span><span>Usuário</span><span>Taxa de conclusão</span><span class="r hide-s">Atrib.</span><span class="r">Final.</span><span class="r hide-s">Tempo médio</span><span class="hide-s">Última finalizada</span></div>
      ${us.map((u,i)=>{
        const p=pct(u.finalizadas,u.atribuidas);
        const tags=[];
        if(lider&&u===lider) tags.push(`<span class="tag" style="--c:#d97706">${ico(IC.flame)}Maior volume</span>`);
        if(rapido&&u===rapido&&us.filter(x=>x.tempo_medio_seg!=null).length>1) tags.push(`<span class="tag" style="--c:#0891b2">${ico(IC.bolt)}Mais rápido</span>`);
        if(u.atribuidas>0&&p===100) tags.push(`<span class="tag" style="--c:#16a34a">${ico(IC.check)}100%</span>`);
        return `<div class="rk-r ${i<3&&u.finalizadas>0?"m"+(i+1):""}" style="--uc:${esc(u.cor)};--dl:${0.05*i}s">
          <div class="rk-pos">${i+1}</div>
          <div class="rk-u"><span class="rk-av">${esc(inicial(u.nomusu))}</span><div style="min-width:0"><div class="rk-nm" title="${esc(u.nomusu)}">${esc(u.nomusu)}</div>${tags.length?`<div class="tags">${tags.join("")}</div>`:""}</div></div>
          <div class="pg"><div class="pg-t"><div class="pg-f" style="width:${p}%;--dl:${0.05*i+0.15}s"></div></div><span class="pg-p">${p}%</span></div>
          <div class="num hide-s">${u.atribuidas}</div>
          <div class="num"><strong>${u.finalizadas}</strong></div>
          <div class="num hide-s">${esc(fmtDur(u.tempo_medio_seg))}<div class="muted" style="font-size:.62rem">${esc(fmtDur(u.tempo_min_seg))} – ${esc(fmtDur(u.tempo_max_seg))}</div></div>
          <div class="hide-s muted">${esc(fmtData(u.ultima_finalizada))}</div>
        </div>`;}).join("")}
    </div>`;
  }

  $("filtros").addEventListener("click",e=>{
    const b=e.target.closest("[data-p]"); if(!b) return;
    document.querySelectorAll("#filtros button").forEach(x=>x.classList.toggle("on",x===b));
    periodo=b.dataset.p; moveInd(); carregar();
  });
  $("btnRefresh").addEventListener("click",carregar);
  moveInd(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(moveInd);
  carregar();
</script>
</body>
</html>
